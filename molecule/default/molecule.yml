---
# Docker scenario — fast; runs on GitHub public runners.
# Uses molecule's built-in "default" (delegated) driver + our own create/destroy
# playbooks driving community.docker. This avoids molecule-plugins[docker], whose
# create playbook is incompatible with ansible-core 2.21 (data-tagging changes).
dependency:
  name: galaxy   # auto-installs molecule/default/collections.yml (scenario-absolute path)

driver:
  name: default
  options:
    managed: true

platforms:
  # Distro selected by MOLECULE_DISTRO (CI matrix: debian12, rockylinux9 — the two
  # sqlite package branches: apt 'sqlite3' vs dnf 'sqlite').
  # systemd-enabled images so the litedump service/timer units can be tested in-container.
  - name: litedump-${MOLECULE_DISTRO:-debian12}
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest"
    systemd: true
    groups:
      - litedump_servers

provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        # The docker connection already runs as root, so become is a redundant
        # sudo wrapper here — and sudo's PAM stack breaks intermittently in EL9
        # containers on CI runners ("PAM account management error"). Connection
        # variables override the play-level `become: true` keyword.
        ansible_become: false
        # Test fixtures — single source of truth shared by converge/prepare/verify.
        # (group_vars are in scope for verify.yml, which does NOT load defaults/vars.)
        # Realistic /var paths, not /tmp (PrivateTmp would hide /tmp from the service).
        litedump_databases:
          - src: /var/lib/litedump-test/delete.db    # default rollback-journal mode
            dest: /var/backups/litedump-test/delete/
          - src: /var/lib/litedump-test/wal.db       # WAL mode — exercises the H1 source-dir fix
            dest: /var/backups/litedump-test/wal/
          - src: "/var/lib/litedump test/spaced.db"  # spaces in src + dest — ReadWritePaths quoting
            dest: "/var/backups/litedump test/spaced/"
        litedump_retention: 3
        litedump_timer_oncalendar: "*-*-* *:00/30:00"
  playbooks:
    create: create.yml
    destroy: destroy.yml
    prepare: prepare.yml
    converge: converge.yml
    side_effect: side_effect.yml
    verify: verify.yml

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    # side_effect drives the backup repeatedly to exercise retention pruning (see
    # side_effect.yml) — inserted after idempotence, before verify (happy path).
    - side_effect
    - verify
    - destroy
