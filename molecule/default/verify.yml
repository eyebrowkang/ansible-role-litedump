---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Check backup script exists
      ansible.builtin.stat:
        path: /usr/local/bin/litedump.sh
      register: script_stat

    - name: Assert backup script exists and is executable
      ansible.builtin.assert:
        that:
          - script_stat.stat.exists
          - script_stat.stat.executable
        quiet: true

    - name: Check systemd units exist
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ item }}"
      register: unit_stat
      loop:
        - litedump.service
        - litedump.timer

    - name: Assert systemd units exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        quiet: true
      loop: "{{ unit_stat.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check timer is enabled and active
      ansible.builtin.systemd_service:
        name: litedump.timer
      register: timer_status

    - name: Assert timer is enabled and active
      ansible.builtin.assert:
        that:
          - timer_status.status.UnitFileState == "enabled"
          - timer_status.status.ActiveState == "active"
        quiet: true

    # Trigger the backup through the REAL systemd service (oneshot), not a manual
    # script run — this is what the timer does, and it exercises the unit sandbox
    # (PrivateTmp / ProtectSystem=strict / ReadWritePaths). A unit that can't start
    # (e.g. 226/NAMESPACE) or a WAL source it can't read fails the play here.
    - name: Run the backup via the systemd service
      ansible.builtin.systemd_service:
        name: litedump.service
        state: started

    - name: Find the backup produced for each database
      ansible.builtin.find:
        paths: "{{ item.dest }}"
        patterns: >-
          {{ (item.src | basename | regex_replace('\.[^.]*$', '')) ~ '_*.sqlite' }}
      register: backups
      loop: "{{ litedump_databases }}"
      loop_control:
        label: "{{ item.src }}"

    - name: Assert each database produced a backup
      ansible.builtin.assert:
        that:
          - item.matched >= 1
        fail_msg: "No backup found in {{ item.item.dest }} for {{ item.item.src }}"
        quiet: true
      loop: "{{ backups.results }}"
      loop_control:
        label: "{{ item.item.src }}"

    - name: Verify each backup's integrity (content must round-trip)
      ansible.builtin.command:
        cmd: sqlite3 "{{ item.files[0].path }}" "SELECT name FROM test WHERE id=1;"
      register: integrity
      changed_when: false
      failed_when: integrity.stdout != "hello"
      loop: "{{ backups.results }}"
      loop_control:
        label: "{{ item.item.src }}"
