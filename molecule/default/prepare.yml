---
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Update apt cache (Debian)
      ansible.builtin.apt:
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Install sqlite client (package name differs across distros)
      ansible.builtin.package:
        name: "{{ 'sqlite3' if ansible_os_family in ['Debian', 'Suse'] else 'sqlite' }}"
        state: present

    - name: Create source database directories
      ansible.builtin.file:
        path: "{{ item.src | dirname }}"
        state: directory
        mode: "0755"
      loop: "{{ litedump_databases }}"
      loop_control:
        label: "{{ item.src }}"

    - name: Seed source SQLite databases (force WAL mode on any 'wal' db — the H1 case)
      ansible.builtin.command:
        cmd: sqlite3 "{{ item.src }}" "{{ _seed_sql }}"
        creates: "{{ item.src }}"
      vars:
        _seed_sql: >-
          {{ 'PRAGMA journal_mode=WAL; ' if 'wal' in (item.src | basename) else '' }}CREATE
          TABLE test (id INTEGER PRIMARY KEY, name TEXT); INSERT INTO test VALUES (1, 'hello');
      changed_when: true
      loop: "{{ litedump_databases }}"
      loop_control:
        label: "{{ item.src }}"
